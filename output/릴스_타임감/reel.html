<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>릴스 타임감</title><style>

*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#F1EDE4;color:#111;font-family:P,sans-serif;word-break:keep-all;position:relative}
.mono{font-family:"IBM Plex Mono","DejaVu Sans Mono",monospace;letter-spacing:3px}
.hd{position:absolute;left:84px;right:84px;top:180px;display:flex;justify-content:space-between;font-size:22px;padding-bottom:16px;border-bottom:2px solid #111}
.tt{position:absolute;left:0;right:0;top:280px;text-align:center;font-size:96px;font-weight:700;letter-spacing:-4px;line-height:1.16}
.tt mark{background:linear-gradient(transparent 58%,#F1E8CB 58%);color:inherit;padding:0 6px}
.sc{position:absolute;left:0;right:0;top:560px;height:1060px;opacity:0}
.stage{position:absolute;left:0;right:0;top:60px;height:640px;display:flex;align-items:center;justify-content:center}
.ill{width:900px;height:auto;max-height:600px;overflow:visible}
.row{display:flex;align-items:center;gap:30px}
.cap{position:absolute;left:60px;right:60px;top:760px;text-align:center}
.cap b{display:block;font-size:58px;font-weight:700;letter-spacing:-2px;line-height:1.3}
.beats{display:flex;gap:40px}
.beats i{width:170px;height:170px;border:7px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:64px;font-weight:700;background:#FFFDF7}
.icons{display:flex;gap:44px}
.ic{width:250px;height:250px;border:7px solid #111;border-radius:50%;background:#FFFDF7;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
.ic svg{width:150px;height:150px}
.ic b{font-size:26px;font-weight:700;margin-top:-8px}
.one{width:600px;height:600px;display:flex;align-items:center;justify-content:center}
.one i{display:block;width:180px;height:180px;border-radius:50%;background:#111}
.ft{position:absolute;left:84px;right:84px;top:1650px;display:flex;justify-content:space-between;font-size:22px;color:#8A8A8A;padding-top:16px;border-top:1px solid #C9C3B8}
</style></head><body>
<div class="hd mono"><span>ENOCH MUSIC ACADEMY</span><span>PRACTICE NOTE</span></div>
<div class="tt">같은 곡인데,<br>왜 다르게 들릴까</div>
<section class="sc" id="s1"><div class="stage"><svg viewBox="0 0 900 400" class="ill"><g stroke="#111" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><g id="sh1"><g transform="translate(150,0)"><rect x="0" y="40" width="240" height="320" rx="8" fill="#FFFDF7"/><path d="M30 100 H 210"/><path d="M30 150 H 210"/><path d="M30 200 H 210"/><path d="M30 250 H 210"/><path d="M30 300 H 210"/><g transform="translate(80,190) scale(0.8)" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"><ellipse cx="0" cy="0" rx="14" ry="10" transform="rotate(-20)" fill="#111"/><path d="M12 -4 V -58 q 18 6 22 22"/></g><g transform="translate(150,240) scale(0.8)" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"><ellipse cx="0" cy="0" rx="14" ry="10" transform="rotate(-20)" fill="#111"/><path d="M12 -4 V -58 q 18 6 22 22"/></g></g></g><g id="sh2"><g transform="translate(510,0)"><rect x="0" y="40" width="240" height="320" rx="8" fill="#FFFDF7"/><path d="M30 100 H 210"/><path d="M30 150 H 210"/><path d="M30 200 H 210"/><path d="M30 250 H 210"/><path d="M30 300 H 210"/><g transform="translate(80,190) scale(0.8)" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"><ellipse cx="0" cy="0" rx="14" ry="10" transform="rotate(-20)" fill="#111"/><path d="M12 -4 V -58 q 18 6 22 22"/></g><g transform="translate(150,240) scale(0.8)" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"><ellipse cx="0" cy="0" rx="14" ry="10" transform="rotate(-20)" fill="#111"/><path d="M12 -4 V -58 q 18 6 22 22"/></g></g></g><path id="eq" d="M420 180 H 480 M420 220 H 480"/></g></svg></div><div class="cap"><b id="k1">같은 곡, 같은 음인데</b></div></section><section class="sc" id="s2"><div class="stage"><div class="row"><div id="c2"><svg viewBox="-170 -280 340 420" width="360" height="400" style="overflow:visible"><g transform="translate(0,0) scale(1.0,1.0)" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M70 -10 V -250"/><path d="M70 -250 C 110 -220, 140 -200, 120 -140"/><path d="M-30 58 L -38 110 M 30 58 L 36 110"/><path d="M-38 110 h -26 M 36 110 h 26"/><path d="M-88 10 C -120 30, -125 60, -118 80"/><path d="M 92 -20 C 130 -60, 140 -90, 132 -120"/><ellipse cx="0" cy="0" rx="95" ry="70" transform="rotate(-18)" fill="#FFFDF7"/><g stroke="none" fill="#DDE37C"><ellipse cx="-50" cy="22" rx="16" ry="10"/><ellipse cx="44" cy="4" rx="16" ry="10"/></g><path d="M-38 -4 q 8 -10 16 0 M 14 -18 q 8 -10 16 0" stroke-width="5"/><path d="M-16 12 Q 0 32 18 6" stroke-width="5"/></g></svg></div><svg viewBox="0 0 300 360" width="300" height="360" style="overflow:visible"><g id="n2"><g transform="translate(60,260) scale(1)" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"><ellipse cx="0" cy="0" rx="14" ry="10" transform="rotate(-20)" fill="#111"/><path d="M12 -4 V -58 q 18 6 22 22"/></g><g transform="translate(170,170) scale(1.2)" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"><ellipse cx="0" cy="0" rx="14" ry="10" transform="rotate(-20)" fill="#111"/><path d="M12 -4 V -58 q 18 6 22 22"/></g><g transform="translate(90,90) scale(0.9)" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"><ellipse cx="0" cy="0" rx="14" ry="10" transform="rotate(-20)" fill="#111"/><path d="M12 -4 V -58 q 18 6 22 22"/></g></g></svg></div></div><div class="cap"><b id="k2">누가 치면 듣기 좋고</b></div></section><section class="sc" id="s3"><div class="stage"><div class="row"><div id="c3"><svg viewBox="-170 -280 340 420" width="360" height="400" style="overflow:visible"><g transform="translate(0,0) scale(1.0,1.0)" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M70 -10 V -250"/><path d="M70 -250 C 110 -220, 140 -200, 120 -140"/><path d="M-30 58 L -38 110 M 30 58 L 36 110"/><path d="M-38 110 h -26 M 36 110 h 26"/><path d="M-88 10 C -120 30, -125 60, -118 80"/><path d="M 92 0 C 120 20, 128 50, 122 72"/><ellipse cx="0" cy="0" rx="95" ry="70" transform="rotate(-18)" fill="#FFFDF7"/><g stroke="none" fill="#DDE37C"><ellipse cx="-50" cy="22" rx="16" ry="10"/><ellipse cx="44" cy="4" rx="16" ry="10"/></g><g fill="#111" stroke="none"><circle cx="-30" cy="-8" r="5"/><circle cx="22" cy="-22" r="5"/></g><path d="M-20 18 q 6 -8 12 0 t 12 0 t 12 0" stroke-width="5"/><path d="M 112 -60 c -10 14 -10 24 0 26 c 10 -2 10 -12 0 -26 z" fill="#FFFDF7" stroke-width="4"/><path d="M -118 -40 c -8 12 -8 20 0 22 c 8 -2 8 -10 0 -22 z" fill="#FFFDF7" stroke-width="4"/></g></svg></div></div></div><div class="cap"><b id="k3">누가 치면 어딘가 불안합니다</b></div></section><section class="sc" id="s4"><div class="stage"><svg viewBox="0 0 900 560" class="ill"><g stroke="#111" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round">
   <path d="M330 470 L 400 120 H 470 L 540 470 Z" fill="#FFFDF7"/><path d="M300 470 H 570"/><circle cx="435" cy="380" r="16" fill="#111"/>
   <g id="arm" style="transform-origin:435px 380px"><path d="M435 380 L 435 150"/><rect x="420" y="200" width="30" height="22" fill="#111"/></g></g></svg></div><div class="cap"><b id="k4">차이는 음이 아니라 시간에 있어요</b></div></section><section class="sc" id="s5"><div class="stage"><div class="beats" id="wob"><i id="w1"><span>1</span></i><i id="w2"><span>2</span></i><i id="w3"><span>3</span></i><i id="w4"><span>4</span></i></div></div><div class="cap"><b id="k5">타임이 흔들리면<br>듣는 사람이 먼저 압니다</b></div></section><section class="sc" id="s6"><div class="stage"><div class="icons"><div class="ic" id="i1"><svg viewBox="0 0 200 200"><g stroke="#111" stroke-width="7" fill="none" stroke-linecap="round"><ellipse cx="100" cy="80" rx="62" ry="20"/><path d="M38 80 V 140 C 38 166, 162 166, 162 140 V 80"/><path d="M60 40 L 96 70 M140 40 L 104 70"/></g></svg><b>Drum</b></div><div class="ic" id="i2"><svg viewBox="0 0 200 200"><g stroke="#111" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(35 100 100)"><path d="M100 120 C 70 112, 58 140, 70 160 C 82 182, 118 182, 130 160 C 142 140, 130 112, 100 120 Z"/><path d="M100 120 V 24"/><rect x="90" y="10" width="20" height="22" rx="3"/><path d="M88 150 H 112"/></g></svg><b>Bass</b></div><div class="ic" id="i3"><svg viewBox="0 0 200 200"><g stroke="#111" stroke-width="7" fill="none" stroke-linejoin="round"><rect x="24" y="70" width="152" height="70" rx="6"/><path d="M52 70 V 140 M80 70 V 140 M108 70 V 140 M136 70 V 140"/></g><g fill="#111"><rect x="44" y="70" width="14" height="40"/><rect x="72" y="70" width="14" height="40"/><rect x="128" y="70" width="14" height="40"/></g></svg><b>Keys</b></div></div></div><div class="cap"><b id="k6">합주에서는 한 사람의 박이<br>모두의 박이 되고</b></div></section><section class="sc" id="s7"><div class="stage"><div class="row"><div id="c7"><svg viewBox="-170 -280 340 420" width="360" height="400" style="overflow:visible"><g transform="translate(0,0) scale(1.0,1.0)" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M70 -10 V -250"/><path d="M70 -250 C 110 -220, 140 -200, 120 -140"/><path d="M-30 58 L -38 110 M 30 58 L 36 110"/><path d="M-38 110 h -26 M 36 110 h 26"/><path d="M-88 -10 C -130 -40, -140 -80, -130 -110"/><path d="M 92 -20 C 130 -60, 140 -90, 132 -120"/><ellipse cx="0" cy="0" rx="95" ry="70" transform="rotate(-18)" fill="#FFFDF7"/><g stroke="none" fill="#DDE37C"><ellipse cx="-50" cy="22" rx="16" ry="10"/><ellipse cx="44" cy="4" rx="16" ry="10"/></g><path d="M-38 -4 q 8 -10 16 0 M 14 -18 q 8 -10 16 0" stroke-width="5"/><path d="M-16 12 Q 0 32 18 6" stroke-width="5"/></g></svg></div><svg viewBox="0 0 300 360" width="300" height="360" style="overflow:visible"><g id="n7"><g transform="translate(60,260) scale(1)" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"><ellipse cx="0" cy="0" rx="14" ry="10" transform="rotate(-20)" fill="#111"/><path d="M12 -4 V -58 q 18 6 22 22"/></g><g transform="translate(170,170) scale(1.2)" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"><ellipse cx="0" cy="0" rx="14" ry="10" transform="rotate(-20)" fill="#111"/><path d="M12 -4 V -58 q 18 6 22 22"/></g><g transform="translate(90,90) scale(0.9)" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"><ellipse cx="0" cy="0" rx="14" ry="10" transform="rotate(-20)" fill="#111"/><path d="M12 -4 V -58 q 18 6 22 22"/></g></g></svg></div></div><div class="cap"><b id="k7">그루브가 있으면 몸이 먼저 반응해요</b></div></section><section class="sc" id="s8"><div class="stage"><div class="beats" id="sync"><i id="y1"><span>1</span></i><i id="y2"><span>2</span></i><i id="y3"><span>3</span></i><i id="y4"><span>4</span></i></div></div><div class="cap"><b id="k8">정확함은 믿음을 만들고</b></div></section><section class="sc" id="s9"><div class="stage"><svg viewBox="0 0 900 400" class="ill"><g stroke="#111" stroke-width="8" fill="none" stroke-linecap="round">
   <path id="flat" d="M60 200 H 840" stroke="#B9B4AA"/>
   <path id="wave" d="M60 200 C 150 80, 240 80, 330 200 S 510 320, 600 200 S 780 80, 840 170" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></g></svg></div><div class="cap"><b id="k9">그루브는 음악을 살아 있게 만드는 것.</b></div></section><section class="sc" id="s10"><div class="stage"><div class="one"><i id="dot"></i></div></div><div class="cap"><b id="k10">화려한 음 하나보다,<br>흔들리지 않는 한 박.</b></div></section>
<div class="ft"><span>에녹실용음악학원 시흥점</span><span class="mono">031 315 3666</span></div>
<script>
const T=[0, 2.0, 3.8, 5.8, 8.0, 10.2, 12.6, 14.6, 16.4, 18.4, 22.01];
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x));
const ease=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function up(el,p,dy=30){if(!el)return;el.style.opacity=ease(p);el.style.transform=`translateY(${(1-ease(p))*dy}px)`;}
function pop(el,p,extra=""){if(!el)return;el.style.opacity=cl(p*3);el.style.transform=`scale(${0.3+0.7*back(p)}) ${extra}`;}
window.setT=function(t){
  for(let i=0;i<10;i++){const s=$('s'+(i+1));const a=T[i],b=T[i+1];s.style.opacity=(t>=a&&t<b)?1:0; up($('k'+(i+1)),(t-a)/0.35,24);}
  let u;
  u=t-T[0]; pop($('sh1'),u/0.5); pop($('sh2'),(u-0.25)/0.5); $('eq').style.opacity=cl((u-0.6)*3);
  $('sh1').style.transformOrigin='270px 200px'; $('sh2').style.transformOrigin='630px 200px';
  u=t-T[1]; pop($('c2'),u/0.5,`translateY(${-Math.abs(Math.sin(u*5))*24}px)`); $('n2').style.opacity=cl((u-0.3)*2); $('n2').style.transform=`translateY(${-u*30}px)`;
  u=t-T[2]; pop($('c3'),u/0.5,`translateX(${Math.sin(u*40)*6*cl(u-0.4)}px)`);
  u=t-T[3]; $('arm').style.transform=`rotate(${Math.sin(u*Math.PI*2*1.05)*24}deg)`;
  u=t-T[4]; for(let k=1;k<=4;k++){const e=$('w'+k);const ph=(u*2.2)%4;const on=Math.floor(ph)===k-1&&u>0.2;
    const j=Math.sin(u*9+k*2)*14*cl(u-0.6); e.style.transform=`translate(${j}px,${Math.cos(u*7+k)*10*cl(u-0.6)}px) scale(${on?1.12:1})`; e.style.background=on?'#F1E8CB':'#FFFDF7';}
  u=t-T[5]; for(let k=1;k<=3;k++){pop($('i'+k),(u-0.1-0.3*(k-1))/0.45); const ph=(u*2)%1; $('i'+k).style.background=(u>1.2&&ph<0.25)?'#F1E8CB':'#FFFDF7';}
  u=t-T[6]; pop($('c7'),u/0.5,`translateY(${-Math.abs(Math.sin(u*6))*34}px) rotate(${Math.sin(u*6)*5}deg)`); $('n7').style.opacity=cl((u-0.3)*2); $('n7').style.transform=`translateY(${-u*30}px)`;
  u=t-T[7]; for(let k=1;k<=4;k++){const e=$('y'+k);const ph=(u*2.2)%4;const on=Math.floor(ph)===k-1&&u>0.2;e.style.background=on?'#F1E8CB':'#FFFDF7';e.style.transform=`scale(${on?1.12:1})`;}
  u=t-T[8]; $('wave').style.strokeDashoffset=1-ease((u-0.3)/1.2); $('flat').style.opacity=1-ease((u-0.3)/1.2)*0.7;
  u=t-T[9]; const d=$('dot'); const ph=(u*1.6)%1; d.style.opacity=cl(u*3); d.style.transform=`scale(${(0.4+0.6*ease(u/0.5))*(1+0.18*Math.max(0,1-ph*4))})`;
};
setT(0);
</script></body></html>
