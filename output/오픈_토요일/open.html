<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>토요일 오픈</title><style>
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Light.woff2);font-weight:300}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Regular.woff2);font-weight:400}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Bold.woff2);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
:root{--iv:#F1EDE4;--bk:#111;--g:#8A8A8A;--b:#55524D;--mono:"IBM Plex Mono","DejaVu Sans Mono",monospace;--en:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",P,sans-serif}
.s{position:relative;overflow:hidden;background:var(--iv);color:var(--bk);font-family:P,sans-serif;margin-bottom:40px;word-break:keep-all}
.hd{position:absolute;left:96px;right:96px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:21px;letter-spacing:3px;padding-bottom:20px;border-bottom:1.5px solid currentColor}
.ft{position:absolute;left:96px;right:96px;display:flex;justify-content:space-between;font-size:21px;padding-top:20px;border-top:1.5px solid currentColor}
.ft span:last-child{font-family:var(--mono);font-size:20px;letter-spacing:2px}
.a{position:absolute}
.k{font-family:var(--mono);font-size:20px;letter-spacing:3px;color:var(--g);text-transform:uppercase}
.big{font-family:var(--en);font-weight:700;letter-spacing:-7px;line-height:.9}
.ph{background:#111 url(../../images/공간/복도_01.jpg) no-repeat;background-size:cover;filter:grayscale(.85) sepia(.12) contrast(1.04)}
.tm{font-family:var(--en);font-weight:300;letter-spacing:-2px}
.p{font-size:30px;line-height:1.7;color:var(--b);letter-spacing:-.6px}
</style></head><body>

<div class="ph a" style="left:96px;right:96px;top:350px;height:600px;background-position:50% 50%"></div>

<div class="a" style="right:96px;top:1000px;text-align:right"><div class="k">Today</div><div class="tm" style="font-size:58px;margin-top:8px">10:00 — 18:00</div></div>
<div class="p a" style="right:96px;top:1110px;text-align:right;font-size:26px">토요일, 문 열었습니다.</div>
<div class="ft" style="bottom:60px"><span>에녹실용음악학원 시흥점</span><span>010 3949 3666</span></div>
</section>

<div class="a" style="right:96px;top:1435px;text-align:right"><div class="k">Today</div><div class="tm" style="font-size:58px;margin-top:8px">10:00 — 18:00</div></div>
<div class="p a" style="right:96px;top:1545px;text-align:right;font-size:26px">토요일, 문 열었습니다.</div>
