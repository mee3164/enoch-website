<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Light.woff2);font-weight:300}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Regular.woff2);font-weight:400}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-SemiBold.woff2);font-weight:600}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Bold.woff2);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:P,sans-serif;color:#F3F1EC;background:#0B0B0B;margin-bottom:40px}
.ph{position:absolute;inset:0;background:url(../../images/학생/레코딩_01.jpg) 8% 50%/cover no-repeat}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 16%,rgba(0,0,0,0) 55%,rgba(0,0,0,.78) 82%,rgba(0,0,0,.88) 100%)}
.lab{font-size:22px;font-weight:600;letter-spacing:6px}
.g{color:rgba(243,241,236,.7)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#DDE37C;margin-right:14px;vertical-align:2px}
/* A */
#A .top{position:absolute;left:80px;right:80px;top:230px;display:flex;justify-content:space-between}
#A .t{position:absolute;left:76px;top:1330px;font-size:150px;line-height:.92;letter-spacing:-4px}
#A .t b{font-weight:700}#A .t i{font-style:normal;font-weight:300}
#A .bt{position:absolute;left:80px;right:80px;top:1630px;padding-top:22px;border-top:1px solid rgba(255,255,255,.3);display:flex;justify-content:space-between;font-size:24px}
/* B */
#B .fade{background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.82) 85%)}
#B .t{position:absolute;left:0;right:0;top:1440px;text-align:center;font-size:58px;font-weight:300;letter-spacing:26px;padding-left:26px}
#B .ln{position:absolute;left:50%;top:1540px;width:1px;height:56px;background:rgba(255,255,255,.5)}
#B .d{position:absolute;left:0;right:0;top:1626px;text-align:center}
/* C */
#C .fade{background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 70%,rgba(0,0,0,.6) 100%)}
#C .tl{position:absolute;left:80px;top:230px}
#C .t{position:absolute;right:80px;top:300px;text-align:right;font-size:96px;font-weight:700;line-height:.95;letter-spacing:-3px}
#C .bt{position:absolute;left:80px;right:80px;top:1650px;display:flex;justify-content:space-between}
</style></head><body>
<section class="s" id="A"><div class="ph"></div><div class="fade"></div>
  <div class="top"><span class="lab g">ENOCH MUSIC ACADEMY</span><span class="lab g">2026.10.10</span></div>
  <div class="t"><b>Recording</b><br><i>Day</i></div>
  <div class="bt"><span><span class="dot"></span>Vocal</span><span class="g">Find your own true sound.</span></div>
</section>
<section class="s" id="B"><div class="ph"></div><div class="fade"></div>
  <div class="t">RECORDING DAY</div><div class="ln"></div>
  <div class="d lab g">ENOCH MUSIC ACADEMY — 10.10</div>
</section>
<section class="s" id="C"><div class="ph"></div><div class="fade"></div>
  <div class="tl lab g">VOL. 01</div>
  <div class="t">RECORDING<br>DAY</div>
  <div class="bt"><span class="lab"><span class="dot"></span>ENOCH MUSIC ACADEMY</span><span class="lab g">2026.10.10</span></div>
</section>
</body></html>
