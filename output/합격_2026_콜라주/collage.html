<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>2026 합격 콜라주</title>
<!-- 합격증 9장 콜라주 1080×1920 (흰 배경, 글자 없음). 합격증 이미지는 src/ (저장소 제외) -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#fff;position:relative;overflow:hidden}
.col{position:absolute;left:0;right:0;top:130px;height:1680px;background:#E4E1DB;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:395fr 395fr 395fr 520fr;grid-template-areas:"a a b" "c d d" "e e f" "g h i";gap:8px;padding:8px}
.col div{position:relative;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px}
.col img{max-width:100%;max-height:100%;object-fit:contain}
.logo{position:absolute;right:10px;top:10px;width:64px;height:64px;max-width:none!important;max-height:none!important}
</style></head><body>
<div class="col">
  <div style="grid-area:a"><img src="src/01.jpg"></div>
  <div style="grid-area:b"><img src="src/05.jpg"></div>
  <div style="grid-area:c"><img src="src/06.jpg"></div>
  <div style="grid-area:d"><img src="src/02.jpg"></div>
  <div style="grid-area:e"><img src="src/03.jpg"></div>
  <div style="grid-area:f"><img src="src/07.jpg"></div>
  <div style="grid-area:g"><img src="src/09.jpg"><img class="logo" src="src/dima_logo.png"></div>
  <div style="grid-area:h"><img src="src/04.jpg"></div>
  <div style="grid-area:i"><img src="src/08.jpg"><img class="logo" src="src/hanyang_logo.png"></div>
</div>
</body></html>
