<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Light.woff2);font-weight:300}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Medium.woff2);font-weight:500}

*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#111;color:#F1EDE4;font-family:P,sans-serif;position:relative;overflow:hidden}

.tag b{color:#F1EDE4;font-weight:400}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#F1EDE4;margin-right:10px;vertical-align:middle}
.sub{position:absolute;left:72px;top:520px;font-size:36px;font-weight:300;color:#cfc9bd}
.sub b{font-weight:700;color:#F1EDE4}
.win{position:absolute;left:0;top:600px;width:1080px;height:760px;background:#000}
.ft{position:absolute;left:72px;right:72px;top:1390px;display:flex;justify-content:space-between;font-size:20px;color:#8A8A8A;padding-top:16px;border-top:1px solid #444}
</style></head><body>
<div class="hd mono"><span>ENOCH MUSIC ACADEMY</span><span>LESSON SKETCH</span></div>

<div class="win"></div>
<div class="ft mono"><span>에녹실용음악학원 시흥점</span><span>FIND YOUR OWN TRUE SOUND</span></div>
</body></html>
