<style>
.tc { display: grid; grid-template-columns: 1fr 1fr; border-top: 1.5px solid var(--rule); margin-top: 6px; }
.tc > div { padding: 26px 0 0; }
.tc > div + div { padding-left: 36px; padding-right: 24px; border-left: 1px solid var(--hair); background: var(--sage); }
.tc .h { font-family: var(--mono); font-size: 19px; letter-spacing: 2.2px; color: var(--sub); text-transform: uppercase; }
.tc .h b { display: block; margin-top: 6px; font-family: inherit; font-size: 34px; letter-spacing: -1px; color: var(--fg); text-transform: none; font-weight: 800; }
.tc svg { display: block; width: 100%; height: auto; margin: 22px 0 14px; }
.tc p { margin: 0 0 26px; font-size: 27px; line-height: 1.5; letter-spacing: -0.5px; font-weight: 300; color: var(--fg); }
.tc p b { font-weight: 800; }
</style>
<div class="tc">
  <div>
    <div class="h">Tie<b>붙임줄</b></div>
    <svg viewBox="0 0 400 210"><g stroke="#111" stroke-width="1.4"><line x1="10" y1="80" x2="390" y2="80"/><line x1="10" y1="100" x2="390" y2="100"/><line x1="10" y1="120" x2="390" y2="120"/><line x1="10" y1="140" x2="390" y2="140"/><line x1="10" y1="160" x2="390" y2="160"/></g>

    <path d="M124 158 Q195 192 266 158" fill="none" stroke="#111" stroke-width="2.6"/></svg>
