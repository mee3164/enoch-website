<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>강사 소개 손주희 썸네일 1:1</title><style>
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Light.woff2);font-weight:300}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Regular.woff2);font-weight:400}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-SemiBold.woff2);font-weight:600}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Bold.woff2);font-weight:700}
:root{--iv:#F1EDE4;--bk:#111;--g:#8A8A8A;--b:#55524D;--mono:"IBM Plex Mono","DejaVu Sans Mono",monospace;--en:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",P,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--iv);color:var(--bk);font-family:P,sans-serif;margin-bottom:40px;word-break:keep-all}
.hd{position:absolute;left:96px;right:96px;top:72px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:21px;letter-spacing:3px;padding-bottom:20px;border-bottom:1.5px solid currentColor}
.ft{position:absolute;left:96px;right:96px;bottom:60px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:20px;letter-spacing:2px;padding-top:20px;border-top:1.5px solid currentColor}
.ft span:first-child{font-family:P,sans-serif;letter-spacing:0;font-size:21px}
.k{font-family:var(--mono);font-size:19px;letter-spacing:3px;color:var(--g);text-transform:uppercase}
.ph{position:absolute;background:#111 url(../../images/강사/손주희_01.jpg) no-repeat}
.en{font-family:var(--en);font-weight:700;letter-spacing:-3px;line-height:.95}
.row{display:grid;grid-template-columns:170px 1fr;padding:22px 0;border-bottom:1px solid rgba(17,17,17,.16);font-size:27px;line-height:1.55;letter-spacing:-.5px}
.row .k{padding-top:6px}
.dark{background:var(--bk);color:var(--iv)}
.big{position:absolute;left:92px;font-family:var(--en);font-weight:700;letter-spacing:-5px;line-height:.92}
.ko2{position:absolute;left:96px;right:96px;font-size:44px;font-weight:600;letter-spacing:-1.5px;line-height:1.4}
.sub{position:absolute;left:96px;right:96px;font-size:28px;line-height:1.7;color:var(--b);letter-spacing:-.5px}
.dark .sub{color:#C9C4BB}
.lbl{position:absolute;left:96px;top:190px}
.tl{position:absolute;left:96px;right:96px;top:250px;border-top:1.5px solid currentColor}
.tl .row{grid-template-columns:160px 1fr;padding:19px 0;font-size:28px}
.tl .row i{font-style:normal;color:var(--g);font-weight:300}
.dark .row{border-bottom-color:rgba(241,237,228,.16)}
.two{position:absolute;left:96px;right:96px;top:250px;columns:2;column-gap:40px;font-size:27px;line-height:1.55;letter-spacing:-.4px}
.two div{break-inside:avoid;padding:12px 0;border-bottom:1px solid rgba(241,237,228,.14)}
.two i{font-style:normal;color:#8C8C8C;font-weight:300}
#b5 .row{padding:13px 0}
</style></head><body>
<section class="s" style="height:1080px;margin:0"><div class="hd"><span>ENOCH MUSIC ACADEMY</span><span>ENOCH TEACHERS — VOCAL</span></div>
<div class="ph" style="left:96px;right:96px;top:146px;height:600px;background-size:cover;background-position:60% 32%;filter:grayscale(1) sepia(.16) contrast(1.05)"></div>
<div class="en" style="position:absolute;left:92px;top:782px;font-size:112px">SON JU HUI</div>
<div style="position:absolute;left:96px;top:900px;font-size:32px;letter-spacing:10px">손주희 <span style="color:var(--g);letter-spacing:2px;font-size:26px;margin-left:12px">보컬</span></div>
<div class="ft" style="bottom:48px"><span style="font-family:P,sans-serif;letter-spacing:0">시흥 보컬학원 · 강사 소개</span><span>031 315 3666</span></div>
</section>
</body></html>
