<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>합격 축하 서경대 피아노</title><style>
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Light.woff2);font-weight:300}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Regular.woff2);font-weight:400}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Bold.woff2);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
:root{--iv:#F1EDE4;--bk:#111;--g:#8A8A8A;--b:#55524D;--bu:#F1E8CB;--mono:"IBM Plex Mono","DejaVu Sans Mono",monospace;--en:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",P,sans-serif}
.s{position:relative;overflow:hidden;background:var(--iv);color:var(--bk);font-family:P,sans-serif;margin-bottom:40px;word-break:keep-all}
.a{position:absolute}
.hd{position:absolute;left:96px;right:96px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:21px;letter-spacing:3px;padding-bottom:20px;border-bottom:1.5px solid currentColor}
.ft{position:absolute;left:96px;right:96px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:20px;letter-spacing:2px;padding-top:20px;border-top:1.5px solid currentColor}
.k{font-family:var(--mono);font-size:20px;letter-spacing:3px;color:var(--g);text-transform:uppercase}
.tb{border-top:1.5px solid #111}
.tb div{display:grid;grid-template-columns:190px 1fr;padding:18px 0;border-bottom:1px solid rgba(17,17,17,.16);font-size:30px;letter-spacing:-.6px;align-items:baseline}
.tb span:first-child{font-family:var(--mono);font-size:19px;letter-spacing:3px;color:var(--g)}
.tb b{font-weight:700}
</style></head><body>
<section class="s" id="feed" style="width:1080px;height:1350px">
<div class="hd" style="top:72px"><span>ENOCH MUSIC ACADEMY</span><span>ENOCH NEWS — 2027</span></div>
<div class="a" style="left:0;right:0;top:150px;height:560px;background:var(--bu)"></div>
<div class="k a" style="left:96px;top:200px;color:#55524D">Congratulations · 2027 수시</div>
<div class="a" style="left:96px;top:250px;font-weight:300;font-size:96px;letter-spacing:-4px;line-height:1">축</div>
<div class="a" style="left:80px;top:370px;font-weight:700;font-size:310px;letter-spacing:-20px;line-height:1">합격</div>
<div class="a" style="right:96px;top:220px;text-align:right;font-family:var(--en);font-weight:300;font-size:64px;letter-spacing:-2px;line-height:1">PASS</div>
<div class="a" style="right:96px;top:300px;text-align:right;font-family:var(--mono);font-size:19px;letter-spacing:3px;color:#55524D">1ST ROUND</div>
<div class="a tb" style="left:96px;right:96px;top:760px">
<div><span>UNIVERSITY</span><b>서경대학교</b></div>
<div><span>MAJOR</span><span style="font-family:P,sans-serif;font-size:30px;letter-spacing:-.6px;color:#111">실용음악 피아노</span></div>
<div><span>ADMISSION</span><span style="font-family:P,sans-serif;font-size:30px;letter-spacing:-.6px;color:#111">수시 · 실기우수자 전형</span></div>
<div><span>RESULT</span><b>1단계 합격</b></div>
<div><span>NAME</span><span style="font-family:P,sans-serif;font-size:30px;letter-spacing:-.6px;color:#111">양○린</span></div>
</div>
<div class="a" style="left:96px;right:96px;top:1165px;font-size:30px;letter-spacing:-.6px;color:var(--b)">합격을 진심으로 축하합니다. <b style="color:#111">다음 무대까지, 응원합니다.</b></div>
<div class="ft" style="bottom:60px"><span style="font-family:P,sans-serif;letter-spacing:0;font-size:21px">에녹실용음악학원 시흥점</span><span>PIANO · 1:1</span></div>
</section></body></html>
