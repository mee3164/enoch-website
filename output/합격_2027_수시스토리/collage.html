<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>2027 수시 합격 스토리</title>
<!-- 스토리 포스터 1080×1920 — 합격증 이미지는 src/ (저장소 제외). 렌더: node render.mjs → story.png -->
<style>
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Light.woff2);font-weight:300}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-SemiBold.woff2);font-weight:600}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Bold.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#111;color:#F1EDE4;font-family:P,sans-serif;word-break:keep-all;position:relative;overflow:hidden}
.mono{font-family:"IBM Plex Mono","DejaVu Sans Mono",monospace}
.hd{position:absolute;left:60px;right:60px;top:120px;display:flex;justify-content:space-between;font-size:20px;letter-spacing:3px}

.col div{background:#fff;overflow:hidden}
.col div{display:flex;align-items:center;justify-content:center}
.col img{max-width:100%;max-height:100%;object-fit:contain}
.k{position:absolute;left:60px;top:1450px;font-size:20px;letter-spacing:3px;color:#9A958C}
h1{position:absolute;left:60px;top:1214px;font-size:66px;font-weight:700;letter-spacing:-2px}
.lst{position:absolute;left:60px;right:60px;top:1490px;font-size:22px;line-height:1.6;color:#C9C4BB}
.lst b{color:#F1EDE4;font-weight:600}
.body{position:absolute;left:60px;right:60px;top:1510px;font-size:25px;font-weight:300;line-height:1.6;color:#D9D4CA}
.body b{color:#F1EDE4;font-weight:600}
.big{display:block;margin:10px 0 6px;font-size:42px;font-weight:700;color:#F1EDE4;letter-spacing:-1px}
.ft{position:absolute;left:60px;right:60px;bottom:70px;display:flex;justify-content:space-between;font-size:19px;letter-spacing:2px;padding-top:14px;border-top:1px solid rgba(241,237,228,.3);color:#C9C4BB}
</style></head><body>
<div class="col">
  <div><img src="src/kukje1.jpg"></div><div><img src="src/kukje2.jpg"></div>
