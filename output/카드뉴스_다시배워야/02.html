<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>02 — 1도 차이 (모션)</title>
<!-- 카드 02 모션: 같은 점에서 출발한 두 선이 멀어질수록 벌어진다. 각도는 이해를 돕기 위해 크게 그림.
     node render.mjs 02.html 7 02.mp4  /  정지 컷: node render.mjs 02.html peek 7 → 02.png -->
<link rel="stylesheet" href="../../templates/card.css">
<style>
html,body{background:#555}
.card{padding:0}
.dia{position:absolute;left:96px;right:96px;top:70px;height:600px}
svg{width:888px;height:600px;overflow:visible}
.lb{font-family:var(--ko);font-size:23px;letter-spacing:-.3px;fill:#6E6A64}
.st{font-family:var(--mono);font-size:20px;letter-spacing:1.5px;fill:#6E6A64}
.lbk{font-family:var(--ko);font-size:28px;font-weight:600;letter-spacing:-.5px}
.deg{font-family:var(--en);font-size:40px;font-weight:700;fill:#111}
.txt{position:absolute;left:96px;right:96px;top:770px}
.txt .title{font-size:56px;line-height:1.3}
.txt .body{margin-top:26px}
</style></head><body>
<div class="card theme-ivory">
 <div class="masthead"><span>ENOCH MUSIC ACADEMY</span><span>PRACTICE NOTE</span></div>
 <div class="dia"><svg viewBox="0 0 888 600">
  <g id="brk"></g>
  <line id="la" x1="40" y1="470" x2="40" y2="470" stroke="#8A8A8A" stroke-width="3" stroke-dasharray="10 9"/>
  <line id="lb" x1="40" y1="470" x2="40" y2="470" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <circle cx="40" cy="470" r="9" fill="#111"/>
  <text class="st" x="40" y="516" text-anchor="middle">START</text>
  <g id="arc" opacity="0"><path id="arcp" fill="none" stroke="#111" stroke-width="2"/><text class="deg" id="degt">1°</text></g>
  <circle id="da" r="8" fill="#8A8A8A" opacity="0"/><circle id="db" r="9" fill="#111" opacity="0"/>
  <text id="ta" class="lbk" fill="#8A8A8A" text-anchor="end" opacity="0">가려던 곳</text>
  <text id="tb" class="lbk" fill="#111" text-anchor="end" opacity="0">도착한 곳</text>
 </svg></div>
 <div class="txt">
  <div class="title">출발할 때 1도 차이는<br>눈에 잘 보이지 않습니다.</div>
  <div class="body">그런데 멀리 갈수록, <span class="em">도착하는 곳은 전혀 달라져요.</span></div>
 </div>
 <div class="colophon"><span>다시 배우는 이유</span><span class="page">02 / 08</span></div>
</div>
<script>
const O={x:40,y:470}, L=808, ANG=15*Math.PI/180;      // 그림용 각도(과장)
const marks=[{f:.3,t:"처음"},{f:.64,t:"몇 달 뒤"},{f:1,t:"몇 년 뒤"}];
const ez=u=>u<=0?0:u>=1?1:(u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2);
const cl=u=>Math.max(0,Math.min(1,u));
const $=id=>document.getElementById(id);
const brk=$("brk"); const NS="http://www.w3.org/2000/svg";
marks.forEach((m,i)=>{const g=document.createElementNS(NS,"g");g.id="m"+i;
 g.innerHTML=`<line stroke="#111" stroke-width="1.5"/><line stroke="#111" stroke-width="1.5"/><line stroke="#111" stroke-width="1.5"/><text class="lb" text-anchor="middle">${m.t}</text>`;brk.appendChild(g);});
function pt(f,ang){return{x:O.x+L*f*Math.cos(ang),y:O.y-L*f*Math.sin(ang)}}
function setT(t){
 const p=ez(cl((t-.4)/3.8));
 const a=pt(p,0), b=pt(p,ANG);
 $("la").setAttribute("x2",a.x);$("la").setAttribute("y2",a.y);
 $("lb").setAttribute("x2",b.x);$("lb").setAttribute("y2",b.y);
 // 1° 호
 const ao=cl((t-.3)/.6); $("arc").setAttribute("opacity",ao);
 const r=150, e=pt(r/L,ANG); $("arcp").setAttribute("d",`M${O.x+r} ${O.y} A${r} ${r} 0 0 0 ${e.x} ${e.y}`);
 $("degt").setAttribute("x",O.x+r+16);$("degt").setAttribute("y",O.y-2);
 marks.forEach((m,i)=>{const g=$("m"+i);const k=ez(cl((t-(.4+3.8*inv(m.f)))/.5));
  const A=pt(m.f,0),B=pt(m.f,ANG); const yb=A.y+(B.y-A.y)*k;
  const [v,c1,c2,tx]=g.children; const x=A.x;
  v.setAttribute("x1",x);v.setAttribute("y1",A.y);v.setAttribute("x2",x);v.setAttribute("y2",yb);
  c1.setAttribute("x1",x-8);c1.setAttribute("x2",x+8);c1.setAttribute("y1",A.y);c1.setAttribute("y2",A.y);
  c2.setAttribute("x1",x-8);c2.setAttribute("x2",x+8);c2.setAttribute("y1",yb);c2.setAttribute("y2",yb);
  tx.setAttribute("x",i==2?x-40:x);tx.setAttribute("y",A.y+46);
  g.setAttribute("opacity",k>0?1:0);});
 const eo=cl((t-4.4)/.6);
 const A=pt(1,0),B=pt(1,ANG);
 $("da").setAttribute("cx",A.x);$("da").setAttribute("cy",A.y);$("da").setAttribute("opacity",eo);
 $("db").setAttribute("cx",B.x);$("db").setAttribute("cy",B.y);$("db").setAttribute("opacity",eo);
 $("ta").setAttribute("x",A.x-24);$("ta").setAttribute("y",A.y-18);$("ta").setAttribute("opacity",eo);
 $("tb").setAttribute("x",B.x-24);$("tb").setAttribute("y",B.y-20);$("tb").setAttribute("opacity",eo);
}
// p(t)=f 가 되는 시점의 진행률(0–1) — ez의 역함수
function inv(f){let lo=0,hi=1;for(let j=0;j<30;j++){const m=(lo+hi)/2;ez(m)<f?lo=m:hi=m}return lo}
window.setT=setT; setT(7);
</script>
</body></html>
