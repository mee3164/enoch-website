<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>reel</title><style>
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Regular.woff2);font-weight:400}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-SemiBold.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#F1EDE4;color:#111;font-family:P,sans-serif;word-break:keep-all;position:relative}
.mono{font-family:"IBM Plex Mono","DejaVu Sans Mono",monospace;letter-spacing:3px}
.sc{position:absolute;inset:0;opacity:0}
.lab{position:absolute;font-size:22px;color:#8A8A8A}
.title{position:absolute;font-size:88px;font-weight:600;letter-spacing:-4px;line-height:1.1}
.title .ln{display:block}
.tx{position:absolute;font-size:56px;font-weight:400;letter-spacing:-2px;line-height:1.18;white-space:nowrap}
.ph{position:absolute;overflow:hidden;background:#E4DFD4}
.ph img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.82) contrast(1.02)}
.br{position:absolute;overflow:visible}
.br path{fill:none;stroke:#111;stroke-width:3}
</style></head><body>
<section class="sc" id="s0"><div class="lab mono" style="left:124px;top:700px">PRACTICE NOTE — RAINY DAY</div><div class="title" style="left:120px;top:760px"><span class="ln">비 오는 날의</span><span class="ln">연습</span></div></section><section class="sc" id="s1"><div class="tx t0" style="left:120px;top:560px">우산 하나에 텀블러 챙겨서,</div><div class="tx t1" style="left:120px;top:1320px">연습실 가는 길.</div><div class="lab mono pl" style="left:300px;top:642px">01</div><div class="ph" style="left:300px;top:700px;width:480px;height:540px" data-cx="540.0"><img src="src/coffee.jpg" style="object-position:22% 50%"></div></section><section class="sc" id="s2"><div class="tx t0" style="left:120px;top:600px">습도가 높은 날은</div><div class="tx t1" style="left:600px;top:1080px">목이 덜<br>건조합니다</div><div class="lab mono pl" style="left:140px;top:682px">02</div><div class="ph" style="left:140px;top:740px;width:380px;height:480px" data-cx="330.0"><img src="src/rain.jpg" style="object-position:50% 35%"></div></section><section class="sc" id="s3"><div class="tx t0" style="left:120px;top:640px">빗소리는<br>일정해서</div><div class="tx t1" style="left:400px;top:1070px">다른 소음이<br>덜 들려요</div><div class="lab mono pl" style="left:560px;top:542px">03</div><div class="ph" style="left:560px;top:600px;width:380px;height:400px" data-cx="750.0"><img src="src/guitarroom.jpg" style="object-position:55% 50%"></div></section><section class="sc" id="s4"><div class="tx t0" style="left:120px;top:560px">텀블러 속 커피가<br>반쯤 줄어드는 동안</div><div class="tx t1" style="left:120px;top:1300px">같은 소절을<br>몇 번 더.</div><div class="lab mono pl" style="left:500px;top:722px">04</div><div class="ph" style="left:500px;top:780px;width:440px;height:440px" data-cx="720.0"><img src="src/rack.jpg" style="object-position:50% 70%"></div></section><section class="sc" id="s5"><div class="tx t0" style="left:120px;top:520px">오늘은 내 소리가</div><div class="tx t1" style="left:120px;top:1100px">조금 더 잘<br>들리는 날.</div><div class="lab mono pl" style="left:460px;top:602px">05</div><div class="ph" style="left:460px;top:660px;width:500px;height:520px" data-cx="710.0"><img src="src/stage.jpg" style="object-position:50% 40%"></div></section><section class="sc" id="s6"><div class="lab mono" style="left:124px;top:760px">ENOCH MUSIC ACADEMY</div><div class="tx t0" style="left:120px;top:810px;font-weight:600">에녹실용음악학원 시흥점</div><div class="tx t1 mono" style="left:124px;top:930px;font-size:34px;letter-spacing:2px">031 315 3666</div><div class="tx t1" style="left:124px;top:1000px;font-size:30px;color:#8A8A8A;letter-spacing:-.5px">체험수업 · 네이버 플레이스 예약</div></section>
<script>
const T=[0, 2.0, 4.5, 7.0, 9.5, 12.0, 14.5, 16.91];
const cl=x=>Math.max(0,Math.min(1,x)); const ease=x=>1-Math.pow(1-cl(x),3);
function rise(el,p){el.style.opacity=ease(p);el.style.transform=`translateY(${(1-ease(p))*18}px)`;}
window.setT=function(t){
  for(let i=0;i<T.length-1;i++){
    const s=document.getElementById('s'+i); const u=t-T[i], d=T[i+1]-T[i];
    const on=u>=0&&u<d; if(!on){s.style.opacity=0;continue;}
    s.style.opacity=Math.min(cl(u/0.18), cl((d-u)/0.2));
    s.querySelectorAll('.title .ln').forEach((e,k)=>rise(e,(u-0.1-k*0.25)/0.4));
    s.querySelectorAll('.lab').forEach(e=>e.style.opacity=ease((u-(i===0?0:0.45))/0.3));
    s.querySelectorAll('.tx.t0').forEach(e=>rise(e,(u-0.1)/0.35));
    s.querySelectorAll('.tx.t1').forEach(e=>rise(e,(u-0.8)/0.35));
    s.querySelectorAll('.brs').forEach((b,k)=>{
      const p=ease((u-0.3-k*0.35)/0.4); const cx=+b.dataset.cx;
      const L=b.querySelector('.L'), R=b.querySelector('.R');
      const lx=parseFloat(L.style.left), rx=parseFloat(R.style.left);
      L.style.transform=`translateX(${(cx-lx)*(1-p)*0.9}px)`; R.style.transform=`translateX(${(cx-rx)*(1-p)*0.9}px)`;
      L.style.opacity=R.style.opacity=cl(p*3);
    });
    s.querySelectorAll('.ph').forEach((ph,k)=>{
      const p=ease((u-0.45-k*0.35)/0.45);
      ph.style.clipPath=`inset(0 ${50*(1-p)}% 0 ${50*(1-p)}%)`;
      ph.querySelector('img').style.transform=`scale(${1.12-0.1*cl(u/d)})`;
    });
  }
};
setT(0);
</script></body></html>
