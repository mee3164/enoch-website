<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>reel</title><style>
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-Regular.woff2);font-weight:400}
@font-face{font-family:P;src:url(../../templates/fonts/Pretendard-SemiBold.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#F1EDE4;color:#111;font-family:P,sans-serif;word-break:keep-all;position:relative}
.mono{font-family:"IBM Plex Mono","DejaVu Sans Mono",monospace;letter-spacing:3px}
.sc{position:absolute;inset:0;opacity:0}
.lab{position:absolute;font-size:22px;color:#8A8A8A}
.title{position:absolute;font-size:88px;font-weight:600;letter-spacing:-4px;line-height:1.1}
.title .ln{display:block}
.tx.sub{font-size:40px;color:#555;letter-spacing:-1.5px}
.tx{position:absolute;font-size:56px;font-weight:400;letter-spacing:-2px;line-height:1.18;white-space:nowrap}
.ph{position:absolute;overflow:hidden;background:#E4DFD4}
.ph img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.82) contrast(1.02)}
.br{position:absolute;overflow:visible}
.br path{fill:none;stroke:#111;stroke-width:3}
</style></head><body>
<section class="sc" id="s0"><div class="tx t0 sub" style="left:120px;top:470px">우산과 텀블러 하나 챙겨서 연습실로,</div><div class="title" style="left:116px;top:550px"><span class="ln">비 오는 날의</span><span class="ln">연습</span></div><div class="lab mono" style="left:300px;top:802px">01</div><div class="ph" style="left:300px;top:860px;width:480px;height:600px"><img src="src/cover.jpg" style="object-position:22% 50%"></div></section><section class="sc" id="s1"><div class="tx t0" style="left:120px;top:560px">비 오는 날은<br>습도가 높습니다.</div><div class="tx t1" style="left:120px;top:1120px">목이 덜 건조해서<br>소리 내기가 편합니다.</div><div class="lab mono pl" style="left:600px;top:482px">02</div><div class="ph" style="left:600px;top:540px;width:360px;height:460px" data-cx="780.0"><img src="src/rain.jpg" style="object-position:50% 35%"></div></section><section class="sc" id="s2"><div class="tx t0" style="left:120px;top:640px">빗소리는<br>일정해서</div><div class="tx t1" style="left:400px;top:1070px">다른 소음이<br>덜 들려요.</div><div class="lab mono pl" style="left:560px;top:542px">03</div><div class="ph" style="left:560px;top:600px;width:380px;height:400px" data-cx="750.0"><img src="src/guitarroom.jpg" style="object-position:55% 50%"></div></section><section class="sc" id="s3"><div class="tx t0" style="left:120px;top:560px">그래서 내 소리에</div><div class="tx t1" style="left:120px;top:1300px">집중하기 좋습니다.</div><div class="lab mono pl" style="left:440px;top:642px">04</div><div class="ph" style="left:440px;top:700px;width:500px;height:500px" data-cx="690.0"><img src="src/rack.jpg" style="object-position:50% 70%"></div></section><section class="sc" id="s4"><div class="tx t0" style="left:120px;top:520px">비 오는 날,</div><div class="tx t1" style="left:120px;top:1240px">평소보다 한 번 더<br>연습해 보세요.</div><div class="lab mono pl" style="left:460px;top:582px">05</div><div class="ph" style="left:460px;top:640px;width:500px;height:520px" data-cx="710.0"><img src="src/stage.jpg" style="object-position:50% 40%"></div></section><section class="sc" id="s5"><div class="lab mono" style="left:124px;top:760px">ENOCH MUSIC ACADEMY</div><div class="tx t0" style="left:120px;top:810px;font-weight:600">에녹실용음악학원 시흥점</div><div class="tx t1 mono" style="left:124px;top:930px;font-size:34px;letter-spacing:2px">031 315 3666</div><div class="tx t1" style="left:124px;top:1000px;font-size:30px;color:#8A8A8A;letter-spacing:-.5px">경기도 시흥시 은행로 157 2층</div><div class="tx t1" style="left:124px;top:1050px;font-size:30px;color:#8A8A8A;letter-spacing:-.5px">체험수업 · 네이버 플레이스 예약</div></section>
<script>
const T=[0, 3.0, 5.6, 8.2, 10.8, 13.4, 16.01];
const cl=x=>Math.max(0,Math.min(1,x)); const ease=x=>1-Math.pow(1-cl(x),3);
function rise(el,p){el.style.opacity=ease(p);el.style.transform=`translateY(${(1-ease(p))*18}px)`;}
window.setT=function(t){
  for(let i=0;i<T.length-1;i++){
    const s=document.getElementById('s'+i); const u=t-T[i], d=T[i+1]-T[i];
    const on=u>=0&&u<d; if(!on){s.style.opacity=0;continue;}
    s.style.opacity=Math.min(cl(u/0.18), cl((d-u)/0.2));
    s.querySelectorAll('.title .ln').forEach((e,k)=>rise(e,(u-0.1-k*0.25)/0.4));
    s.querySelectorAll('.lab').forEach(e=>e.style.opacity=ease((u-(i===0?0:0.45))/0.3));
    s.querySelectorAll('.tx.t0').forEach(e=>rise(e,(u-0.1)/0.35));
    s.querySelectorAll('.tx.t1').forEach(e=>rise(e,(u-0.8)/0.35));
    s.querySelectorAll('.brs').forEach((b,k)=>{
      const p=ease((u-0.3-k*0.35)/0.4); const cx=+b.dataset.cx;
      const L=b.querySelector('.L'), R=b.querySelector('.R');
      const lx=parseFloat(L.style.left), rx=parseFloat(R.style.left);
      L.style.transform=`translateX(${(cx-lx)*(1-p)*0.9}px)`; R.style.transform=`translateX(${(cx-rx)*(1-p)*0.9}px)`;
      L.style.opacity=R.style.opacity=cl(p*3);
    });
    s.querySelectorAll('.ph').forEach((ph,k)=>{
      const p=ease((u-0.45-k*0.35)/0.45);
      ph.style.clipPath=`inset(0 ${50*(1-p)}% 0 ${50*(1-p)}%)`;
      ph.querySelector('img').style.transform=`scale(${1.12-0.1*cl(u/d)})`;
    });
  }
};
setT(0);
</script></body></html>
