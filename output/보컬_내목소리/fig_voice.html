<style>
.vc{display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid var(--rule);margin-top:6px}
.vc>div{padding:28px 0 0}
.vc>div+div{padding-left:36px;padding-right:24px;border-left:1px solid var(--hair);background:var(--blush)}
.vc .h{font-family:var(--mono);font-size:19px;letter-spacing:2.2px;color:var(--sub);text-transform:uppercase}
.vc .h b{display:block;margin-top:6px;font-family:inherit;font-size:34px;letter-spacing:-1px;color:var(--fg);text-transform:none;font-weight:800}
.vc svg{display:block;width:100%;height:auto;margin:26px 0 18px}
.vc p{margin:0 0 28px;font-size:27px;line-height:1.5;letter-spacing:-.5px;font-weight:300;color:var(--fg)}
.vc p b{font-weight:800}
</style>
<div class="vc">
  <div>
    <div class="h">When you sing<b>내가 듣는 소리</b></div>
    <svg viewBox="0 0 400 220"><g fill="none" stroke="#111" stroke-linecap="round">
      <path d="M40 80 h220" stroke-width="5"/><path d="M246 66 l18 14 l-18 14" stroke-width="5"/>
      <path d="M40 150 h220" stroke-width="5" stroke-dasharray="2 14"/><path d="M246 136 l18 14 l-18 14" stroke-width="5"/></g>
      <text x="40" y="60" font-size="24" font-weight="700" fill="#111">공기로</text>
      <text x="40" y="196" font-size="24" font-weight="700" fill="#111">머리뼈로</text>
      <circle cx="320" cy="115" r="34" fill="#111"/><text x="320" y="124" font-size="24" font-weight="700" fill="#F1EDE4" text-anchor="middle">귀</text></svg>
    <p>두 길로 함께 들려서<br><b>더 낮고 풍성하게</b><br>느껴져요.</p>
  </div>
  <div>
    <div class="h">On the recording<b>녹음된 소리</b></div>
    <svg viewBox="0 0 400 220"><g fill="none" stroke="#111" stroke-linecap="round">
      <path d="M40 80 h220" stroke-width="5"/><path d="M246 66 l18 14 l-18 14" stroke-width="5"/></g>
      <text x="40" y="60" font-size="24" font-weight="700" fill="#111">공기로</text>
      <text x="40" y="200" font-size="24" font-weight="300" fill="#6E6A64">머리뼈 소리는 안 담겨요</text>
      <circle cx="320" cy="115" r="34" fill="none" stroke="#111" stroke-width="3"/><text x="320" y="124" font-size="22" font-weight="700" fill="#111" text-anchor="middle">MIC</text></svg>
    <p>다른 사람이 듣는<br>내 목소리는<br><b>이쪽</b>이에요.</p>
  </div>
</div>
